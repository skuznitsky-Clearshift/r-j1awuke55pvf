<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>דוחות תחקיר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#167398;--acc2:#3595bb;--dark:#0e4a63;--ink:#1d1d1f;--sub:#6e6e73;--line:#e5e5ea;--bg:#f5f5f7;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#f5f5f7;--sub:#a1a1a6;--line:#2c2c2e;--bg:#000;--card:#1c1c1e}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
header{flex:none;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.brand{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--acc);font-weight:600;margin-bottom:8px}
.brand span:last-child{color:var(--sub);font-weight:400}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:999px;padding:7px 14px;font:600 14px Heebo,sans-serif;background:rgba(22,115,152,.1);color:var(--acc);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:#fff}
#track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#track::-webkit-scrollbar{display:none}
section{flex:none;width:100%;height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding:14px 12px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.head{background:radial-gradient(circle at 80% 0,#3fa3c9,#167398 55%,#0e4a63);color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:12px}
.head h2{font-size:24px;font-weight:800;line-height:1.2}
.head .meta{font-size:13px;opacity:.85;margin-top:4px}
.head .prob{font-size:16px;font-weight:600;margin-top:10px;line-height:1.45}
.info{background:var(--card);border-radius:22px;padding:4px 18px;margin-bottom:12px}
.info .row{padding:12px 0;border-bottom:1px solid var(--line)}.info .row:last-child{border:0}
.info b{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:3px}
.info p{font-size:16px;line-height:1.45}
section img{display:block;width:100%;height:auto;border-radius:16px;background:#fff}
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));flex:none;background:var(--bg)}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--acc)}
.msg{margin:auto;max-width:320px;text-align:center;padding:24px;color:var(--sub);font-size:17px;line-height:1.6}
.msg b{display:block;color:var(--ink);font-size:21px;margin-bottom:6px}
</style>
</head>
<body>
<header><div class="brand"><span>קלירשיפט · דוחות תחקיר</span><span id="exp"></span></div><nav id="nav"></nav></header>
<main id="track"><div class="msg" id="msg">טוען…</div></main>
<div class="dots" id="dots"></div>
<script>
(async()=>{
const $=id=>document.getElementById(id),msg=t=>{$('track').innerHTML='<div class="msg">'+t+'</div>';$('nav').innerHTML='';$('dots').innerHTML=''};
const b64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const k=new URLSearchParams(location.hash.slice(1)).get('k');
if(!k)return msg('<b>אין גישה</b>הקישור לא שלם. פתח אותו מהודעת סגירת היום.');
let p;
try{
  const r=await fetch('d.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)return msg('<b>אין דוחות פעילים</b>אין כרגע פעולה תקועה לא מוסברת, או שעברו 72 שעות מהעדכון האחרון.');
  const j=await r.json();
  const key=await crypto.subtle.importKey('raw',b64(k),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.iv)},key,b64(j.ct));
  p=JSON.parse(new TextDecoder().decode(pt));
}catch(e){return msg('<b>הקישור לא תקף</b>כנראה יצא דוח חדש יותר. פתח את הקישור מהסגירה האחרונה.')}
p.reports=(p.reports||[]).filter(x=>!x.checked_at||Date.now()-new Date(x.checked_at)<259200000);
if(!p.reports.length)return msg('<b>אין דוחות פעילים</b>אין כרגע פעולה תקועה לא מוסברת.');
const exp=new Date(p.expires);
if(Date.now()>exp)return msg('<b>פג תוקף</b>הדוחות היו זמינים 72 שעות.');
$('exp').textContent='עד '+exp.toLocaleString('he-IL',{weekday:'short',hour:'2-digit',minute:'2-digit'});
const T=$('track'),N=$('nav'),D=$('dots');T.innerHTML='';
p.reports.forEach((x,i)=>{
  const s=document.createElement('section');
  s.innerHTML='<div class="head"><h2></h2><div class="meta"></div><div class="prob"></div></div><div class="info"></div>';
  s.querySelector('h2').textContent=x.client;
  s.querySelector('.meta').textContent=[x.order,x.since,x.days!=null?'תקוע '+x.days+' ימים':''].filter(Boolean).join(' · ');
  s.querySelector('.prob').textContent=x.problem||'';
  const inf=s.querySelector('.info'),row=(k,v)=>{if(!v||(Array.isArray(v)&&!v.length))return;const d=document.createElement('div');d.className='row';const b=document.createElement('b');b.textContent=k;d.appendChild(b);(Array.isArray(v)?v:[v]).forEach(t=>{const p=document.createElement('p');p.textContent=t;d.appendChild(p)});inf.appendChild(d)};
  row('🆕 מה חדש',x.updates);row('📞 פנייה לשירות',x.support);row('💰 מימון',x.funding);
  if(!inf.children.length)inf.remove();
  (x.imgs||[]).forEach(src=>{const im=new Image();im.src=src;im.alt=x.client;im.loading=i?'lazy':'eager';s.appendChild(im)});
  T.appendChild(s);
  const b=document.createElement('button');b.textContent=x.client;b.onclick=()=>s.scrollIntoView({behavior:'smooth',inline:'start',block:'nearest'});N.appendChild(b);
  D.appendChild(document.createElement('i'));
});
const mark=i=>{[...N.children].forEach((b,j)=>b.classList.toggle('on',j===i));[...D.children].forEach((d,j)=>d.classList.toggle('on',j===i));N.children[i]&&N.children[i].scrollIntoView({inline:'center',block:'nearest'})};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6)mark([...T.children].indexOf(e.target))}),{root:T,threshold:[.6]});
[...T.children].forEach(s=>io.observe(s));mark(0);
if(p.reports.length<2)D.style.display='none';
})();
</script>
</body>
</html>
